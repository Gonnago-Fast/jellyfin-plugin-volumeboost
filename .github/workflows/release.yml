# Start a release either from GitHub (Actions -> Release -> Run workflow, enter e.g. 1.0.0.0)
# or by pushing a tag like v1.0.0.0. It will:
#  1. build the plugin with that version,
#  2. publish volumeboost_<version>.zip as a GitHub release,
#  3. add the version to manifest.json on main, so Jellyfin's Catalog offers it.
#
# Jellyfin repository URL (Dashboard -> Plugins -> Repositories):
#   https://raw.githubusercontent.com/<owner>/<repo>/main/manifest.json
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, 4 parts (e.g. 1.0.0.0)'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then VERSION="${INPUT_VERSION#v}"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.3.4 (Jellyfin uses 4-part versions)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          dotnet publish Jellyfin.Plugin.VolumeBoost/Jellyfin.Plugin.VolumeBoost.csproj -c Release -o out
          -p:Version=${{ steps.v.outputs.version }}
          -p:AssemblyVersion=${{ steps.v.outputs.version }}
          -p:FileVersion=${{ steps.v.outputs.version }}

      - name: Package
        id: pkg
        run: |
          ZIP="volumeboost_${{ steps.v.outputs.version }}.zip"
          (cd out && zip -j "../$ZIP" Jellyfin.Plugin.VolumeBoost.dll)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" "${{ steps.pkg.outputs.zip }}" --target main \
            --title "Volume Boost ${{ steps.v.outputs.version }}" --generate-notes

      - name: Update manifest.json
        env:
          VERSION: ${{ steps.v.outputs.version }}
          MD5: ${{ steps.pkg.outputs.md5 }}
          URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/${{ steps.pkg.outputs.zip }}
          OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/update_manifest.py

      - name: Commit manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: add ${{ steps.v.outputs.version }}"
          git push origin main
