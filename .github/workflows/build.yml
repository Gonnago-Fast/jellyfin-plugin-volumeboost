name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish Jellyfin.Plugin.VolumeBoost/Jellyfin.Plugin.VolumeBoost.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.VolumeBoost
          path: out/Jellyfin.Plugin.VolumeBoost.dll
